<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/aui-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/app.css" />
    <!-- Applies the saved theme before the first paint, so static pages never flash the system one. -->
    <script>
      const match = document.cookie.match(/(?:^|;\s*)anchor-cookie:\/\/aui-docs-theme=([^;]+)/);
      if (match) {
        try {
          const mode = JSON.parse(decodeURIComponent(match[1])).mode;
          if (mode && mode !== 'system') document.documentElement.dataset.theme = mode;
        } catch {}
      }
    </script>
    <!--ssr-head-->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
